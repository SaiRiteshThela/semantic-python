name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: pytest --cov=semantic_python --cov-report=term-missing

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Reject private or workspace-only files in the source archive
        run: |
          if tar -tf dist/*.tar.gz | grep -E '/(AGENTS|REQUIREMENTS)\.md$|/\.vscode/|/\.ipynb_checkpoints/'; then
            echo "Source distribution contains a private or workspace-only file."
            exit 1
          fi
      - name: Verify clean wheel installation and offline examples
        run: |
          python -m venv /tmp/semantic-python-clean
          /tmp/semantic-python-clean/bin/python -m pip install --no-deps dist/*.whl
          cd /tmp
          /tmp/semantic-python-clean/bin/python "$GITHUB_WORKSPACE/examples/stop_loop.py"
          /tmp/semantic-python-clean/bin/python "$GITHUB_WORKSPACE/examples/ticket_routing.py"
          /tmp/semantic-python-clean/bin/python "$GITHUB_WORKSPACE/examples/escalation.py"

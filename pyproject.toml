[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "semantic-python"
version = "0.1.0a1"
description = "Experimental semantic values for Python"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Sai Ritesh Thela" }]
keywords = ["semantic", "python", "decision-models", "ai"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/SaiRiteshThela/semantic-python"
Repository = "https://github.com/SaiRiteshThela/semantic-python"
Issues = "https://github.com/SaiRiteshThela/semantic-python/issues"
Changelog = "https://github.com/SaiRiteshThela/semantic-python/blob/main/CHANGELOG.md"

[project.optional-dependencies]
laya = ["laya>=0.4.0,<0.5"]
openai = ["openai>=2,<3"]
notebook = ["ipykernel>=6.29"]
dev = [
  "build>=1.2",
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.8",
  "twine>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/semantic_python"]

[tool.hatch.build.targets.sdist]
include = [
  "/.github",
  "/docs",
  "/examples",
  "/src",
  "/tests",
  "/.gitignore",
  "/CHANGELOG.md",
  "/CONTRIBUTING.md",
  "/LICENSE",
  "/README.md",
  "/SECURITY.md",
  "/TODO.md",
  "/pyproject.toml",
  "/uv.lock",
]
exclude = [
  "/AGENTS.md",
  "/REQUIREMENTS.md",
  "/.vscode",
  "**/.ipynb_checkpoints",
  "**/__pycache__",
]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
testpaths = ["tests"]
markers = ["live: opt-in tests that use real model backends"]

[tool.coverage.run]
branch = true
source = ["semantic_python"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["semantic_python"]
mypy_path = "src"
